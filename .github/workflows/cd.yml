name: CD

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Prepare GitHub release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          header = f"## {version} "

          capture = False
          notes: list[str] = []
          for line in lines:
              if line.startswith(header):
                  capture = True
                  continue
              if capture and line.startswith("## "):
                  break
              if capture:
                  notes.append(line)

          body = "\n".join(notes).strip() + "\n"
          Path("release-notes.md").write_text(body, encoding="utf-8")
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: release-notes.md
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
