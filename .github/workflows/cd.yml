name: CD

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Prepare GitHub release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          header = f"## {version} "

          capture = False
          notes: list[str] = []
          for line in lines:
              if line.startswith(header):
                  capture = True
                  continue
              if capture and line.startswith("## "):
                  break
              if capture:
                  notes.append(line)

          body = "\n".join(notes).strip() + "\n"
          Path("release-notes.md").write_text(body, encoding="utf-8")
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: release-notes.md
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
